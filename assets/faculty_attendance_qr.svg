<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="qrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002244"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
  </defs>

  <rect width="600" height="350" rx="20" fill="url(#qrBg)"/>

  <!-- Scanner Frame -->
  <rect x="50" y="40" width="240" height="270" rx="16" fill="#001F3F" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- Simulated QR Pattern -->
  <g transform="translate(90, 80)">
    <rect width="160" height="160" fill="#FFFFFF" rx="8"/>
    <!-- Target corners -->
    <rect x="15" y="15" width="40" height="40" fill="#003366"/>
    <rect x="25" y="25" width="20" height="20" fill="#FFFFFF"/>
    
    <rect x="105" y="15" width="40" height="40" fill="#003366"/>
    <rect x="115" y="25" width="20" height="20" fill="#FFFFFF"/>

    <rect x="15" y="105" width="40" height="40" fill="#003366"/>
    <rect x="25" y="115" width="20" height="20" fill="#FFFFFF"/>

    <!-- Data Pixels -->
    <rect x="70" y="20" width="15" height="15" fill="#800000"/>
    <rect x="70" y="50" width="25" height="15" fill="#003366"/>
    <rect x="110" y="70" width="20" height="25" fill="#D4AF37"/>
    <rect x="40" y="70" width="25" height="20" fill="#003366"/>
    <rect x="70" y="110" width="35" height="35" fill="#800000"/>
  </g>

  <!-- Laser Scan Line -->
  <line x1="60" y1="160" x2="280" y2="160" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>

  <!-- Info Panel -->
  <g transform="translate(320, 60)">
    <text font-family="'Georgia', serif" font-size="20" font-weight="bold" fill="#D4AF37">QR Attendance Verification</text>
    <text font-family="sans-serif" font-size="12" fill="#E2E8F0" y="30">Alagappa Faculty Classroom Scanner</text>

    <rect y="55" width="230" height="80" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1"/>
    <text x="15" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34D399">✓ VERIFIED STUDENT</text>
    <text x="15" y="100" font-family="sans-serif" font-size="11" fill="#FFFFFF">K. Vijaykumar (2024101001)</text>
    <text x="15" y="118" font-family="sans-serif" font-size="10" fill="#94A3B8">NME-CSE-101 Python Programming</text>

    <rect y="155" width="230" height="70" rx="12" fill="rgba(255, 255, 255, 0.08)"/>
    <text x="15" y="180" font-family="sans-serif" font-size="11" fill="#D4AF37">Enrolled Student Count: 42 / 60</text>
    <text x="15" y="200" font-family="sans-serif" font-size="11" fill="#E2E8F0">Attendance Rate: 94.2%</text>
  </g>
</svg>
