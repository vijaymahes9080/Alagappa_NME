  <!-- Ribbon Tails -->
  <path d="M 130 330 L 100 400 L 160 370 L 180 340 Z" fill="#800000"/>
  <path d="M 270 330 L 300 400 L 240 370 L 220 340 Z" fill="#800000"/>

  <polygon points="200,200 215,230 245,230 220,250 230,280 200,260 170,280 180,250 155,230 185,230" fill="#F6D365"/>
