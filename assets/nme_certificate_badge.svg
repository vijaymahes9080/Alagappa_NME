<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D365"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <!-- Outer Starburst Badge -->
  <circle cx="200" cy="200" r="180" fill="url(#goldRibbon)" stroke="#800000" stroke-width="8"/>
  <circle cx="200" cy="200" r="160" fill="#002244" stroke="#D4AF37" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Inner Seal Content -->
  <circle cx="200" cy="200" r="125" fill="#003366" stroke="#D4AF37" stroke-width="3"/>
  
  <text x="200" y="145" font-family="'Georgia', serif" font-size="16" font-weight="bold" fill="#D4AF37" text-anchor="middle">
