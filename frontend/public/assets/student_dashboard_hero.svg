<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003366"/>
      <stop offset="60%" stop-color="#002244"/>
      <stop offset="100%" stop-color="#800000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="24" fill="url(#heroBg)"/>
  
  <!-- Glowing Accents -->
  <circle cx="700" cy="80" r="180" fill="#D4AF37" opacity="0.12" filter="blur(30px)"/>
  <circle cx="100" cy="320" r="160" fill="#3B82F6" opacity="0.15" filter="blur(30px)"/>

  <!-- University Header Card -->
  <rect x="50" y="40" width="700" height="90" rx="16" fill="rgba(255,255,255,0.08)" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="80" y="80" font-family="'Georgia', serif" font-size="24" font-weight="bold" fill="#FCE7F3">
    ALAGAPPA UNIVERSITY
  </text>
  <text x="80" y="108" font-family="sans-serif" font-size="14" fill="#D4AF37" font-weight="600">
    Student NME Course Registration &amp; Real-Time Seat Desk
  </text>

  <!-- Course Card Preview 1 -->
  <g transform="translate(50, 160)">
    <rect width="330" height="190" rx="16" fill="#FFFFFF" opacity="0.95" filter="url(#glow)"/>
    <rect x="20" y="20" width="100" height="24" rx="6" fill="#003366"/>
    <text x="30" y="36" font-family="monospace" font-size="11" font-weight="bold" fill="#D4AF37">NME-CSE-101</text>
    
    <rect x="220" y="20" width="90" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)"/>
    <circle cx="232" cy="32" r="4" fill="#10B981"/>
    <text x="242" y="36" font-family="sans-serif" font-size="10" font-weight="bold" fill="#10B981">18 Seats Left</text>

    <text x="20" y="75" font-family="'Georgia', serif" font-size="15" font-weight="bold" fill="#002244">
      Python Programming
    </text>
    <text x="20" y="95" font-family="sans-serif" font-size="11" fill="#64748B">
      Faculty: Dr. R. Ramanathan
    </text>
    <text x="20" y="115" font-family="sans-serif" font-size="11" fill="#64748B">
      Venue: Lab 3, Science Block A
    </text>

    <rect x="20" y="135" width="290" height="36" rx="10" fill="#003366"/>
    <text x="110" y="158" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Registered Pass</text>
  </g>

  <!-- Course Card Preview 2 -->
  <g transform="translate(420, 160)">
    <rect width="330" height="190" rx="16" fill="#FFFFFF" opacity="0.95"/>
    <rect x="20" y="20" width="100" height="24" rx="6" fill="#800000"/>
    <text x="30" y="36" font-family="monospace" font-size="11" font-weight="bold" fill="#FFFFFF">NME-MGT-201</text>
    
    <rect x="210" y="20" width="100" height="24" rx="12" fill="rgba(245, 158, 11, 0.15)"/>
    <circle cx="222" cy="32" r="4" fill="#F59E0B"/>
    <text x="232" y="36" font-family="sans-serif" font-size="10" font-weight="bold" fill="#D97706">Waitlist #1</text>

    <text x="20" y="75" font-family="'Georgia', serif" font-size="15" font-weight="bold" fill="#002244">
      Digital Marketing
    </text>
    <text x="20" y="95" font-family="sans-serif" font-size="11" fill="#64748B">
      Faculty: Dr. S. Kanthimathi
    </text>
    <text x="20" y="115" font-family="sans-serif" font-size="11" fill="#64748B">
      Venue: Seminar Hall 2
    </text>

    <rect x="20" y="135" width="290" height="36" rx="10" fill="#D97706"/>
    <text x="105" y="158" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Active Waitlist</text>
  </g>
</svg>
