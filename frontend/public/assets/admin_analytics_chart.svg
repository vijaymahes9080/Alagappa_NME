<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="100%" height="100%">
  <defs>
    <linearGradient id="chartBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6D365"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <rect width="700" height="350" rx="20" fill="url(#chartBg)"/>

  <text x="40" y="45" font-family="'Georgia', serif" font-size="20" font-weight="bold" fill="#FCE7F3">
    Super Admin Enrollment Analytics &amp; Department Ratios
  </text>
  <text x="40" y="68" font-family="sans-serif" font-size="12" fill="#D4AF37">
    Alagappa University NME Seat Fill Ratios (Academic Session 2026-2027)
  </text>

  <!-- Bars Container -->
  <g transform="translate(60, 100)">
    <!-- Gridlines -->
    <line x1="0" y1="0" x2="580" y2="0" stroke="rgba(255,255,255,0.1)" stroke-dasharray="4"/>
    <line x1="0" y1="50" x2="580" y2="50" stroke="rgba(255,255,255,0.1)" stroke-dasharray="4"/>
    <line x1="0" y1="100" x2="580" y2="100" stroke="rgba(255,255,255,0.1)" stroke-dasharray="4"/>
    <line x1="0" y1="150" x2="580" y2="150" stroke="rgba(255,255,255,0.1)"/>

    <!-- Bar 1: CSE -->
    <rect x="30" y="20" width="55" height="130" rx="6" fill="url(#barGrad)"/>
    <text x="45" y="12" font-family="monospace" font-size="11" font-weight="bold" fill="#FFFFFF">92%</text>
    <text x="35" y="175" font-family="sans-serif" font-size="11" fill="#E2E8F0">CSE</text>

    <!-- Bar 2: MGT -->
    <rect x="140" y="5" width="55" height="145" rx="6" fill="#EF4444"/>
    <text x="150" y="-3" font-family="monospace" font-size="11" font-weight="bold" fill="#FCA5A5">100%</text>
    <text x="147" y="175" font-family="sans-serif" font-size="11" fill="#E2E8F0">MGT</text>

    <!-- Bar 3: COM -->
    <rect x="250" y="55" width="55" height="95" rx="6" fill="url(#barGrad)"/>
    <text x="265" y="47" font-family="monospace" font-size="11" font-weight="bold" fill="#FFFFFF">68%</text>
    <text x="257" y="175" font-family="sans-serif" font-size="11" fill="#E2E8F0">COM</text>

    <!-- Bar 4: BIO -->
    <rect x="360" y="40" width="55" height="110" rx="6" fill="url(#barGrad)"/>
    <text x="375" y="32" font-family="monospace" font-size="11" font-weight="bold" fill="#FFFFFF">78%</text>
    <text x="370" y="175" font-family="sans-serif" font-size="11" fill="#E2E8F0">BIO</text>

    <!-- Bar 5: TAM -->
    <rect x="470" y="85" width="55" height="65" rx="6" fill="url(#barGrad)"/>
    <text x="485" y="77" font-family="monospace" font-size="11" font-weight="bold" fill="#FFFFFF">45%</text>
    <text x="480" y="175" font-family="sans-serif" font-size="11" fill="#E2E8F0">TAM</text>
  </g>
</svg>
