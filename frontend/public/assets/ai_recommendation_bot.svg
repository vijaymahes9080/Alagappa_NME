<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002244"/>
      <stop offset="100%" stop-color="#800000"/>
    </linearGradient>
  </defs>

  <rect width="500" height="350" rx="20" fill="url(#aiBg)"/>

  <!-- Robot Head Graphic -->
  <g transform="translate(180, 50)">
    <rect width="140" height="120" rx="24" fill="#003366" stroke="#D4AF37" stroke-width="3"/>
    <!-- Eyes -->
    <circle cx="45" cy="50" r="14" fill="#F6D365"/>
    <circle cx="95" cy="50" r="14" fill="#F6D365"/>
    <circle cx="45" cy="50" r="6" fill="#002244"/>
    <circle cx="95" cy="50" r="6" fill="#002244"/>
    
    <!-- Smile -->
    <path d="M 45 85 Q 70 105 95 85" fill="none" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Antenna -->
    <line x1="70" y1="0" x2="70" y2="-20" stroke="#D4AF37" stroke-width="4"/>
    <circle cx="70" cy="-25" r="8" fill="#10B981"/>
  </g>

  <!-- Speech Bubble -->
  <g transform="translate(60, 200)">
    <rect width="380" height="110" rx="16" fill="#FFFFFF"/>
    <text x="25" y="35" font-family="'Georgia', serif" font-size="14" font-weight="bold" fill="#003366">
      Alagappa AI Course Advisor
    </text>
    <text x="25" y="60" font-family="sans-serif" font-size="11" fill="#475569">
      "Vanakkam! Based on your Management department and 8.85 CGPA,
    </text>
    <text x="25" y="78" font-family="sans-serif" font-size="11" fill="#475569">
      I recommend 'NME-CSE-101 Python Programming' (18 seats open)!"
    </text>
    <text x="25" y="98" font-family="sans-serif" font-size="10" font-weight="bold" fill="#10B981">
      ✓ Schedule Clash Verified Clear
    </text>
  </g>
</svg>
